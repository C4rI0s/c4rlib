name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    name: Verify the tag matches the package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must equal pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          python - "$TAG" <<'PY'
          import re, sys, pathlib
          tag = sys.argv[1]
          proj = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          init = pathlib.Path("c4rlib/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'^version\s*=\s*"([^"]+)"', proj, re.M).group(1)
          dunder  = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          assert tag == version == dunder, (
              f"tag v{tag}, pyproject {version}, __init__ {dunder} — bump them together"
          )
          print("releasing", version)
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for Trusted Publishing — mints a short-lived OIDC token so no
      # long-lived PyPI API token has to live in repository secrets.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create the GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/* \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
