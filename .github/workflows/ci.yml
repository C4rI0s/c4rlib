name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  test-installed-wheel:
    name: wheel install · py3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel and import from outside the source tree
        # The package sits at the repo root, so a local `import c4rlib` can
        # shadow the installed one. Running from /tmp proves the *wheel* works.
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "import c4rlib; print(c4rlib.__version__); print(len(c4rlib.__all__), 'exports')"

      - name: Run the test suite against the installed package
        run: |
          pip install pytest
          cp -r tests /tmp/wheel-tests
          cd /tmp && pytest wheel-tests -q

  metadata:
    name: package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate long_description
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Assert version agreement between __init__ and pyproject
        run: |
          python - <<'PY'
          import re, pathlib
          init = pathlib.Path("c4rlib/__init__.py").read_text(encoding="utf-8")
          proj = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          a = re.search(r'__version__\s*=\s*"([^"]+)"', init).group(1)
          b = re.search(r'^version\s*=\s*"([^"]+)"', proj, re.M).group(1)
          assert a == b, f"__init__.py={a} but pyproject.toml={b}"
          print("version", a)
          PY
